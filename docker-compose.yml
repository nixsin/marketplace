services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Generated, like everything else here. The account this container creates
    # for itself and the URL the API connects with are two halves of one fact,
    # and they used to be two literals in two places.
    env_file:
      - ./apps/api/.env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapes compose's own substitution so the shell INSIDE the
      # container expands it, reading the user the container was created with
      # rather than a third copy of the name.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Durability declared here rather than left to the image default, so the
    # dev stack behaves like production instead of quietly losing writes on
    # restart. This is Redis's write-ahead log: every command is appended to
    # an AOF, and `everysec` fsyncs it once a second -- the standard trade,
    # bounded to at most one second of loss rather than the whole window
    # between RDB snapshots.
    #
    # `--save ""` disables RDB snapshotting. Running both costs fork latency
    # and disk for two overlapping durability mechanisms; the AOF is the
    # stronger one, so it is the one kept.
    #
    # Matched by persistence_mode = "aof" on the production Render Key Value
    # instance -- see infra/terraform/render/main.tf.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # THE GENERATED .env.example IS THE SOURCE, not a copy of it.
    #
    # It already declares every variable the contract requires, with the
    # development value for each, and it is itself generated from that
    # contract -- so a variable added to the contract reaches this stack with
    # no edit to this file at all. Before this, ~16 values were duplicated
    # here and held in step only by a test.
    # BOTH files are generated, and the ORDER is the whole mechanism: compose
    # applies env_file entries in sequence, so .env.docker overrides exactly
    # the two variables that differ inside the network (Postgres and Redis
    # answer on service names here) and touches nothing else.
    #
    # This file now contains NO environment values of its own. Both URLs are
    # built from the same parts as their localhost counterparts in
    # packages/config, so the pair cannot drift apart -- which it could when
    # they were separate literals, silently, because each works perfectly in
    # its own context.
    env_file:
      - ./apps/api/.env.example
      - ./apps/api/.env.docker
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/repo/apps/api
      # Mounted, not COPYd: the dev stage is FROM deps and deliberately
      # bakes in no source, so shared-config edits hot-reload like app
      # edits. Without this the workspace symlink points at a directory
      # holding a manifest and no source, and `pnpm dev` dies on import.
      - ./packages:/repo/packages
      # Named volumes over node_modules, not the bind mount above — without
      # these, the bind mount would shadow the node_modules that `pnpm
      # install` populated at image-build time with whatever (likely
      # nothing) exists in the same path on the host. See apps/api/Dockerfile.
      - api_node_modules:/repo/apps/api/node_modules
      - api_root_node_modules:/repo/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./apps/web/.env.example
    # No `environment:` overrides, and this comment is why there are none:
    # NEXT_PUBLIC_* are read by the BROWSER, which runs on the host, so they
    # must stay host-visible (localhost:4000) rather than becoming the
    # Docker-internal `api` hostname the browser cannot resolve. The generated
    # file already carries exactly those values.
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
      # apps/web depends on @medinstru/config (workspace:*), and
      # next.config.ts imports it at startup. The dev stage is FROM deps,
      # which copies only packages/config/package.json for the install --
      # so without this mount the container has a workspace symlink
      # pointing at a directory with no src/index.js in it, and `pnpm dev`
      # dies on the config load with MODULE_NOT_FOUND. Mounted rather than
      # COPYed to match how apps/web itself is provided here: the dev
      # stage deliberately bakes in no source, so live edits to shared
      # config hot-reload the same way app edits already do.
      - ./packages:/repo/packages
      - web_node_modules:/repo/apps/web/node_modules
      - web_root_node_modules:/repo/node_modules
      # Keeps Next's dev build cache off the host filesystem — avoids a
      # root-owned .next/ directory landing in a bind-mounted host repo,
      # and survives container restarts for faster subsequent boots.
      - web_next_cache:/repo/apps/web/.next

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  api_root_node_modules:
  web_node_modules:
  web_root_node_modules:
  web_next_cache:
