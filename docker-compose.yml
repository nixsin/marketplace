services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Generated from packages/config/src/dev-defaults.js. The account the
    # container creates and the URL the API connects with come from one
    # definition, so they cannot drift.
    env_file:
      - docker/dev.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Durability declared here rather than left to the image default, so the
    # dev stack behaves like production instead of quietly losing writes on
    # restart. This is Redis's write-ahead log: every command is appended to
    # an AOF, and `everysec` fsyncs it once a second -- the standard trade,
    # bounded to at most one second of loss rather than the whole window
    # between RDB snapshots.
    #
    # `--save ""` disables RDB snapshotting. Running both costs fork latency
    # and disk for two overlapping durability mechanisms; the AOF is the
    # stronger one, so it is the one kept.
    #
    # Matched by persistence_mode = "aof" on the production Render Key Value
    # instance -- see infra/terraform/render/main.tf.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Both files are generated from the environment contract. Order matters:
    # compose applies them in sequence, so dev.env's service hostnames win
    # over .env.example's localhost ones and nothing else changes.
    env_file:
      - apps/api/.env.example
      - docker/dev.env
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/repo/apps/api
      # Mounted, not COPYd: the dev stage is FROM deps and deliberately
      # bakes in no source, so shared-config edits hot-reload like app
      # edits. Without this the workspace symlink points at a directory
      # holding a manifest and no source, and `pnpm dev` dies on import.
      - ./packages:/repo/packages
      # Named volumes over node_modules, not the bind mount above — without
      # these, the bind mount would shadow the node_modules that `pnpm
      # install` populated at image-build time with whatever (likely
      # nothing) exists in the same path on the host. See apps/api/Dockerfile.
      - api_node_modules:/repo/apps/api/node_modules
      - api_root_node_modules:/repo/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    # .env.example ONLY — no dev.env here, and that is the point. NEXT_PUBLIC_*
    # values are read by the browser, which runs on the host: it must reach
    # localhost:4000, never the Docker-internal `api` hostname it cannot
    # resolve. The localhost values are already the right ones.
    env_file:
      - apps/web/.env.example
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
      # apps/web depends on @medinstru/config (workspace:*), and
      # next.config.ts imports it at startup. The dev stage is FROM deps,
      # which copies only packages/config/package.json for the install --
      # so without this mount the container has a workspace symlink
      # pointing at a directory with no src/index.js in it, and `pnpm dev`
      # dies on the config load with MODULE_NOT_FOUND. Mounted rather than
      # COPYed to match how apps/web itself is provided here: the dev
      # stage deliberately bakes in no source, so live edits to shared
      # config hot-reload the same way app edits already do.
      - ./packages:/repo/packages
      - web_node_modules:/repo/apps/web/node_modules
      - web_root_node_modules:/repo/node_modules
      # Keeps Next's dev build cache off the host filesystem — avoids a
      # root-owned .next/ directory landing in a bind-mounted host repo,
      # and survives container restarts for faster subsequent boots.
      - web_next_cache:/repo/apps/web/.next

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  api_root_node_modules:
  web_node_modules:
  web_root_node_modules:
  web_next_cache:
