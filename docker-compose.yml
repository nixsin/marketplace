services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medinstru
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Durability declared here rather than left to the image default, so the
    # dev stack behaves like production instead of quietly losing writes on
    # restart. This is Redis's write-ahead log: every command is appended to
    # an AOF, and `everysec` fsyncs it once a second -- the standard trade,
    # bounded to at most one second of loss rather than the whole window
    # between RDB snapshots.
    #
    # `--save ""` disables RDB snapshotting. Running both costs fork latency
    # and disk for two overlapping durability mechanisms; the AOF is the
    # stronger one, so it is the one kept.
    #
    # Matched by persistence_mode = "aof" on the production Render Key Value
    # instance -- see infra/terraform/render/main.tf.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server-side only (this process runs inside the Docker network), so
      # these use the compose service names, not localhost.
      # Explicit rather than inferred. Container environments are exactly
      # where detection has least to go on -- compose forwards neither CI nor
      # GITHUB_ACTIONS, so a dev stack running inside GitHub Actions
      # (docker-smoke) looks identical to one on a laptop. Both ARE developer
      # stacks, so saying so beats inferring it twice.
      # EVERY variable in the contract is declared here, not just the ones
      # this stack happens to exercise -- see packages/config/src/env-contract.js.
      # Compose forwards nothing from the host, so anything absent here is
      # absent inside the container, including in docker-smoke (a required
      # check) which would then be testing a configuration nobody wrote down.
      # env-example-drift.test.js fails if one goes missing.
      #
      # EMPTY (`NAME=`) is a real value meaning "off", not a gap.
      APP_ENV: "localhost"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/medinstru?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev-secret-change-me"
      PORT: "4000"
      # Off: the per-IP rate limit does not run. Storing nothing is the honest
      # option locally -- an unkeyed digest over IPv4 is reversible.
      INQUIRY_IP_HASH_SECRET: ""
      # Nothing sits in front of this stack, so no header is trustworthy.
      INQUIRY_TRUST_PROXY_HEADERS: "false"
      # The filesystem. Correct here; refused on a deployment.
      BLOB_PROVIDER: "local"
      BLOB_ACCESS_KEY_ID: ""
      BLOB_SECRET_ACCESS_KEY: ""
      # Used for the product link in outbound inquiries. The browser reaches
      # the web app on the host port, not the compose service name.
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      # WhatsApp delivery off: inquiries are recorded and never sent. This is
      # deliberate -- the seed writes unroutable numbers, and a dev stack must
      # not be one misconfiguration away from messaging a real phone.
      WHATSAPP_ACCESS_TOKEN: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_TEMPLATE_NAME: ""
      WHATSAPP_TEMPLATE_LANGUAGE: ""
      WHATSAPP_ALLOW_FREE_FORM: "false"
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/repo/apps/api
      # Mounted, not COPYd: the dev stage is FROM deps and deliberately
      # bakes in no source, so shared-config edits hot-reload like app
      # edits. Without this the workspace symlink points at a directory
      # holding a manifest and no source, and `pnpm dev` dies on import.
      - ./packages:/repo/packages
      # Named volumes over node_modules, not the bind mount above — without
      # these, the bind mount would shadow the node_modules that `pnpm
      # install` populated at image-build time with whatever (likely
      # nothing) exists in the same path on the host. See apps/api/Dockerfile.
      - api_node_modules:/repo/apps/api/node_modules
      - api_root_node_modules:/repo/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Client-side only: NEXT_PUBLIC_* vars are read by the *browser*,
      # which runs on the host, not inside the Docker network — so this
      # must be the host-published port (localhost:4000), never the
      # Docker-internal `api` hostname, which the browser can't resolve.
      # Same rule as the api service above: every contract variable declared.
      APP_ENV: "localhost"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/graphql"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      # Empty: images come from this app's own origin, which is the real state
      # here -- there is no object storage in the dev stack.
      NEXT_PUBLIC_BLOB_BASE_URL: ""
      # Empty: source maps unavailable. The route fails closed, so this is the
      # safe state rather than a broken one.
      SOURCEMAP_SIGNING_KEY: ""
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
      # apps/web depends on @medinstru/config (workspace:*), and
      # next.config.ts imports it at startup. The dev stage is FROM deps,
      # which copies only packages/config/package.json for the install --
      # so without this mount the container has a workspace symlink
      # pointing at a directory with no src/index.js in it, and `pnpm dev`
      # dies on the config load with MODULE_NOT_FOUND. Mounted rather than
      # COPYed to match how apps/web itself is provided here: the dev
      # stage deliberately bakes in no source, so live edits to shared
      # config hot-reload the same way app edits already do.
      - ./packages:/repo/packages
      - web_node_modules:/repo/apps/web/node_modules
      - web_root_node_modules:/repo/node_modules
      # Keeps Next's dev build cache off the host filesystem — avoids a
      # root-owned .next/ directory landing in a bind-mounted host repo,
      # and survives container restarts for faster subsequent boots.
      - web_next_cache:/repo/apps/web/.next

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  api_root_node_modules:
  web_node_modules:
  web_root_node_modules:
  web_next_cache:
