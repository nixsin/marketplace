packages:
  - "apps/*"
  - "packages/*"
overrides:
  # CVE-2026-40345 (HIGH, stack exhaustion on recursive object graphs),
  # fixed in 8.0.0 -- a transitive dependency of @prisma/config (via
  # prisma), not a direct dependency anywhere in this repo. Confirmed
  # prisma@7.9.1 is already latest and still pulls the vulnerable 7.1.5,
  # so there's no upstream bump that resolves this on its own; this
  # override forces the fixed version regardless of what prisma's own
  # package.json declares. Remove once a prisma release bumps its own
  # deepmerge-ts dependency past 8.0.0. Same fix as PR #79/#80 -- pre-
  # existing on main, unrelated to any of these PRs' own diffs, blocking
  # a required check.
  deepmerge-ts: ^8.0.1
  # GHSA-3f6p-5ww8-9rcr (HIGH, auth-plugin downgrade to
  # mysql_clear_password leaks the password), fixed in 3.22.0. A transitive
  # dependency of prisma, which ships drivers for every database it
  # supports; this repo is Postgres-only, so mysql2 is never loaded at
  # runtime -- but it is in the image, and Trivy scans the image.
  #
  # prisma@7.10.0 is the current stable and still declares 3.15.3, so there
  # is no upstream bump to take. Same shape as deepmerge-ts above:
  # pre-existing on main, unrelated to this PR's own diff, and blocking a
  # required check on every Docker-touching PR until it is overridden.
  # Remove once a prisma release bumps its own mysql2 past 3.22.0.
  mysql2: ^3.22.0
  # GHSA-qfvm-cv95-jqjf and GHSA-535w-7cp7-47q4 (both HIGH, denial of
  # service via a crafted multipart request and via an oversized array
  # index in field names), both fixed in 2.3.0. Transitive through
  # @nestjs/platform-express, which this repo does not depend on directly.
  #
  # There is no upstream bump to take, checked rather than assumed:
  # @nestjs/platform-express@12.0.1 IS the current latest and pins
  # multer to exactly 2.2.0, so waiting resolves nothing. Same major, so
  # this is a patch-level forcing rather than an API change. Remove once
  # a @nestjs/platform-express release declares 2.3.0 or later.
  multer@<2.3.0: ^2.3.0
  # GHSA-2883-xcg3-v3hh / CVE-2026-84375 (HIGH, maxTotalMergeKeys does
  # not limit CPU use for empty merge sources), fixed in 3.15.2. Reached only through
  # @istanbuljs/load-nyc-config, i.e. Jest's coverage machinery.
  #
  # SCOPED TO THE 3.x LINE ON PURPOSE, and a bare `js-yaml: ^3.15.2`
  # would be a real regression rather than a stylistic difference: this
  # repo also resolves js-yaml 4.3.2 for other consumers, and 4.x is a
  # breaking API change from 3.x (safeLoad removed, load's signature
  # changed). A blanket override would drag every one of those down onto
  # the 3.x API. The `@3` selector pins only the vulnerable line and
  # leaves 4.x alone.
  js-yaml@3: ^3.15.2
allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.1'
  - '@next/eslint-plugin-next@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - eslint-config-next@16.3.1
  - next@16.3.1
