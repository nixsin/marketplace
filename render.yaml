# Render Blueprint — infrastructure-as-code for this repo's Render deployment.
#
# This documents the live setup in nixsin/marketplace on Render (created by
# hand through the dashboard) so it isn't tribal knowledge trapped in a UI.
# It is NOT currently connected as an active Blueprint sync — Render treats
# a newly-connected Blueprint as authoritative and can try to adopt/recreate
# resources, which needs a deliberate, careful first sync against existing
# services rather than an automatic one. Connect it intentionally via
# Render's "New Blueprint" flow when that's actually wanted.
#
# The app code itself has zero Render-specific logic — every service below
# only configures plain env vars (see README.md "Deployment" section for the
# platform-agnostic contract). Moving to another host means writing new
# infra config there and retiring this file; no application code changes.

databases:
  - name: medinstru-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - name: medinstru-api
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: medinstru-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false # generated once via `openssl rand -base64 32`, set manually in the dashboard

  - name: medinstru-web
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      # Public by nature (shipped to the browser) — see apps/web/Dockerfile
      # for why this must also be passed as a Docker build ARG, not just a
      # runtime env var, for a Docker-based Next.js deploy.
      - key: NEXT_PUBLIC_API_URL
        value: https://medinstru-api.onrender.com/graphql
      # Same mechanism, same reason -- required for generateMetadata's
      # metadataBase (product-details page OpenGraph images). Since this
      # file isn't an active Blueprint sync (see the header comment
      # above), this also needs to be set by hand in Render's dashboard
      # for medinstru-web before it takes effect in production.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://laxair.shop
      # Public origin for blob-stored product images. Build-time again --
      # next.config.ts reads it to derive the CSP img-src entry and the
      # next/image remotePatterns allowlist, both of which are baked into
      # the build. Optional: leave it unset and images are served from this
      # origin exactly as before.
      #
      # NOTE: apps/api needs this too, on the medinstru-api service, where
      # it is a RUNTIME variable rather than a build arg -- the API reads
      # it per request to rewrite each product's imageUrl. Setting it on
      # only one of the two services is a half-configured state: the web
      # app would permit the blob host while the API kept returning local
      # paths, which is exactly the silent no-op this whole thing shipped
      # as the first time.
      - key: NEXT_PUBLIC_BLOB_BASE_URL
        value: https://images.laxair.shop
