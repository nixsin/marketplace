name: Auto-update open PRs after merge

# Whenever a PR merges into main, every other open PR gets stale relative
# to main — most visibly as `mergeStateStatus: BEHIND` in `gh pr view`, and
# concretely as required checks running against an out-of-date base. This
# automates clicking GitHub's own "Update branch" button (the same
# operation `gh pr update-branch` performs) on every other open PR, so
# nobody has to notice and do it by hand.
#
# `pull_request: types: [closed]` (not `push: branches: [main]`) is the
# more precise trigger — it fires once per PR-close event and the `merged`
# check below cleanly separates "actually merged" from "closed without
# merging," which a push-based trigger can't distinguish on its own.
on:
  pull_request:
    types: [closed]

jobs:
  update-open-prs:
    name: Update open PRs to latest main
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    # contents: write is what actually lets the update-branch call push a
    # merge commit onto each PR's branch; pull-requests: write is for
    # listing the PRs themselves.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This step's job is to attempt every PR and never abort partway —
      # one PR's failure (a real merge conflict, or a PR that raced this
      # run and got closed/locked) must not stop the rest from being
      # updated. `set +e` makes that structural instead of relying on
      # `|| true` after each risky command — same reasoning as the
      # equivalent fix in the ai-code-review job (see CLAUDE.md).
      - name: Update every other open PR targeting main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          # --state open already excludes the PR that just merged (it's
          # closed by definition at this point) — no separate exclusion
          # needed.
          pr_numbers=$(gh pr list --repo "${{ github.repository }}" --base main --state open --json number --jq '.[].number')

          if [ -z "$pr_numbers" ]; then
            echo "No other open PRs targeting main."
            exit 0
          fi

          updated=0
          failed=0
          for pr in $pr_numbers; do
            # A non-zero exit here is expected and harmless for a PR
            # that's already up to date (nothing to merge) — not worth
            # guessing at GitHub's exact error wording to classify it.
            # Logging the real response is more trustworthy than a
            # pattern match against text this workflow doesn't control.
            output=$(gh api --method PUT "repos/${{ github.repository }}/pulls/$pr/update-branch" 2>&1)
            if [ $? -eq 0 ]; then
              echo "Updated PR #$pr"
              updated=$((updated + 1))
            else
              echo "PR #$pr: no update performed (already current, or a real conflict) — $output"
              failed=$((failed + 1))
            fi
          done

          echo "Summary: $updated updated, $failed not updated (see individual lines above for why)"
